apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Which backends and sign-in tenant this build targets: OLGA_ENV = dev | prod | local.
 * Metro reads the same variable to pick src/config/environments/<name>.ts, so the
 * JS bundle and the sign-in redirect scheme below always belong to one environment.
 * Debug builds default to dev. A release build must name its environment.
 */
def olgaEnvironments = ["dev", "prod", "local"]
def requestedOlgaEnv = System.getenv("OLGA_ENV")
def olgaEnv = requestedOlgaEnv ?: "dev"
if (!olgaEnvironments.contains(olgaEnv)) {
    throw new GradleException("OLGA_ENV must be one of ${olgaEnvironments.join(', ')} (got '${olgaEnv}')")
}
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name.contains("Release") }
    if (buildsRelease && !requestedOlgaEnv) {
        throw new GradleException("Release builds need an explicit environment: set OLGA_ENV to dev or prod (for example 'npm run build:android:prod').")
    }
    if (buildsRelease && olgaEnv == "local") {
        throw new GradleException("OLGA_ENV=local can't be used for a release build.")
    }
}
// Must match redirectScheme in src/config/environments/<name>.ts.
def olgaAuthRedirectScheme = olgaEnv == "prod" ? "olga" : "olga-dev"
// Event links (olgaapp://event/<id>): their own scheme, because AppAuth's
// redirect activity claims every URL of the auth scheme.
def olgaLinkScheme = olgaEnv == "prod" ? "olgaapp" : "olgaapp-dev"
// Prod is the store app. Every other environment installs next to it as a separate
// app, with its own app ID and launcher name, so a phone can hold both.
def olgaApplicationId = olgaEnv == "prod" ? "com.olga.connect" : "com.olga.connect.dev"
def olgaAppLabel = olgaEnv == "prod" ? "Ol-ga" : "Ol-ga Dev"

/**
 * Release signing with the Play upload key. The keystore and its passwords
 * live outside the repository; OLGA_UPLOAD_KEY_PROPERTIES points at a
 * properties file with storeFile, storePassword, keyAlias and keyPassword.
 * A production release must be signed with it. Dev release builds without it
 * fall back to the debug key, as before.
 */
def uploadKeyPath = System.getenv("OLGA_UPLOAD_KEY_PROPERTIES")
def uploadKey = new Properties()
if (uploadKeyPath) {
    def uploadKeyFile = file(uploadKeyPath)
    if (!uploadKeyFile.exists()) {
        throw new GradleException("OLGA_UPLOAD_KEY_PROPERTIES points at a file that doesn't exist: ${uploadKeyPath}")
    }
    uploadKeyFile.withInputStream { uploadKey.load(it) }
}
def hasUploadKey = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every { uploadKey.getProperty(it) }
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (buildsRelease && olgaEnv == "prod" && !hasUploadKey) {
        throw new GradleException("A production release must be signed with the upload key: set OLGA_UPLOAD_KEY_PROPERTIES to the upload-key.properties file (see deploy/README).")
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.olgamobile"
    defaultConfig {
        applicationId olgaApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Claimed by react-native-app-auth to catch the <scheme>://auth
        // redirect back from Entra External ID's hosted sign-in page.
        manifestPlaceholders = [appAuthRedirectScheme: olgaAuthRedirectScheme, appLabel: olgaAppLabel, linkScheme: olgaLinkScheme]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadKey.getProperty("storeFile"))
                storePassword uploadKey.getProperty("storePassword")
                keyAlias uploadKey.getProperty("keyAlias")
                keyPassword uploadKey.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The Play upload key when it's configured (always, for prod); the
            // debug key otherwise, for dev builds installed on test phones.
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Rebuild the JS bundle when the environment changes.
tasks.matching { it.name.startsWith("createBundle") }.configureEach {
    inputs.property("olgaEnv", olgaEnv)
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
